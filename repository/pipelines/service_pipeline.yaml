pipeline:
  id: service_pipeline
  name: Service Pipeline
  description: Service Pipeline
  version: "1.0.0"

  entry: ip_lookup

  steps:
    - step:
        id: ip_lookup
        name: IP Lookup
        type: service
        service: ipinfo
        operation: ip_lookup
     
  decision:
    - when:
        all:
          - service.ip_lookup.country_code == "US"
      result: approve
      reason: "US"
   
    - when:
        all:
          - service.ip_lookup.country_code == "CN"
      result: decline
      reason: "Non-US"

    - default: true
      result: review
      actions: ["manual_review"]
      reason: "Non-US or CN"
  
  metadata:
    version: "1.0.0"
    author: "Security Team"
    updated: "2025-12-20 10:00:00"

    # Custom fields
    owner: "security_team"
    tags: [login, authentication, security]