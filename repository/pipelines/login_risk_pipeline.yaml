version: "0.1"

# Login Risk Assessment Pipeline
# Comprehensive login security pipeline with device trust, location analysis, and behavior monitoring

import:
  rulesets:
    - rulesets/login_risk.yaml


pipeline:
  id: login_risk_pipeline
  name: Login Risk Assessment Pipeline
  description: |
    Production-grade login risk assessment pipeline.

    Flow:
    1. Event validation (only process login events)
    2. Execute login risk ruleset (5 security rules)
    3. Final decision based on risk score and patterns

    Covered Risk Dimensions:
    - Device Trust (emulators, spoofing, rooted devices)
    - Location Anomalies (impossible travel)
    - Account Takeover Patterns
    - Password Security
    - Failed Login Monitoring

  # Entry point for the pipeline
  entry: login_risk_check

  # Pipeline only executes for login-related events
  when: event.type == "login"

  steps:
    # ==========================================
    # Step 1: Execute Login Risk Ruleset
    # ==========================================
    - step:
        id: login_risk_check
        name: Login Risk Assessment
        type: ruleset
        ruleset: login_risk
        next: end

  decision:
    # Preserve all existing rejection conditions before manual review.
    - when: results.login_risk.signal == "decline"
      result: decline

    # Uses the existing per-user cumulative count; it is not a consecutive streak.
    - when: features.failed_login_count_1h >= 5
      result: review
      actions: ["manual_review"]
      reason: "At least 5 failed logins in the last hour - manual review required"

    # Preserve other review outcomes without adding a manual-review action.
    - when: results.login_risk.signal == "review"
      result: review

    - default: true
      result: approve

  metadata:
    # Required fields
    version: "1.0.0"
    author: "Security Team"
    updated: "2025-12-20 10:00:00"

    # Custom fields
    owner: "security_team"
    tags: [login, authentication, security]
