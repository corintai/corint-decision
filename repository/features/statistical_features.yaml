  # ============================================================================
  # Time-Based Features
  # Request-context lookups must be populated by the upstream feature producer.
  # event.event_id identifies the current event; temporal values exclude it.
  # No fallback is supplied: missing data must not become a safe default.
  # day_check remains unsupported; the weekend example stays commented out.
  # ============================================================================

  - name: is_off_hours
    description: "Precomputed boolean: event occurs during 22:00-06:00 in the business timezone"
    type: lookup
    datasource: lookup_datasource
    key: "event_context:${event.event_id}:is_off_hours"

  # - name: is_weekend
  #   description: "Is event on weekend?"
  #   type: Expression  # Not yet implemented
  #   method: day_check
  #   datasource: computed
  #   days: ["saturday", "sunday"]

  # ============================================================================
  # Geographic Features (for login events)
  # ============================================================================

  - name: hours_since_last_login
    description: "Precomputed hours since the latest login before this event"
    type: lookup
    datasource: lookup_datasource
    key: "login_context:${event.user_id}:${event.event_id}:hours_since_last_login"

  - name: geo_distance_from_last_login
    description: "Precomputed distance in km from the latest login location"
    type: lookup
    datasource: lookup_datasource
    key: "login_context:${event.user_id}:${event.event_id}:geo_distance_from_last_login"

  - name: country_changed
    description: "Precomputed boolean: country differs from the previous login"
    type: lookup
    datasource: lookup_datasource
    key: "login_context:${event.user_id}:${event.event_id}:country_changed"

  # ============================================================================
  # Device Features
  # ============================================================================

  - name: is_new_device
    description: "Precomputed boolean: this device has not been seen for this user in the previous 30 days"
    type: lookup
    datasource: lookup_datasource
    key: "device_context:${event.user_id}:${event.device_id}:${event.event_id}:is_new_device"

  - name: device_fingerprint_changed_24h
    description: "Precomputed count of device fingerprint changes in the preceding 24 hours"
    type: lookup
    datasource: lookup_datasource
    key: "device_context:${event.device_id}:${event.event_id}:device_fingerprint_changed_24h"

  # Note: failed_login_count_1h is defined in user_features.yaml
  # Removed duplicate definition to avoid conflicts

  # ============================================================================
  # Association Analysis Features
  # NOTE: Using count_distinct as workaround for cross_dimension_count
  # ============================================================================

  # devices_per_ip_5h is defined once in ip_features.yaml.

  - name: users_per_ip_5h
    description: "Number of distinct users from same IP (5h window)"
    type: aggregation
    method: distinct
    datasource: events_datasource
    entity: events
    dimension: ip_address
    dimension_value: event.ip_address
    field: user_id
    window: 5h
    timestamp_field: event_timestamp

  - name: users_per_device_24h
    description: "Number of distinct users on same device (24h window)"
    type: aggregation
    method: distinct
    datasource: events_datasource
    entity: events
    dimension: device_id
    dimension_value: event.device_id
    field: user_id
    window: 24h
    timestamp_field: event_timestamp

  # ============================================================================
  # Fraud Pattern Features
  # NOTE: Using count_distinct as workaround for cross_dimension_count
  # ============================================================================

  - name: ip_device_count
    description: "Devices associated with IP (fraud farm detection)"
    type: aggregation
    method: distinct
    datasource: events_datasource
    entity: events
    dimension: ip_address
    dimension_value: event.ip_address
    field: device_id
    window: 5h
    timestamp_field: event_timestamp

  - name: ip_user_count
    description: "Users associated with IP (fraud farm detection)"
    type: aggregation
    method: distinct
    datasource: events_datasource
    entity: events
    dimension: ip_address
    dimension_value: event.ip_address
    field: user_id
    window: 5h
    timestamp_field: event_timestamp

