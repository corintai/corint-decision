[workspace]
members = [
    "crates/corint-decision-model",
    "crates/corint-decision-dsl-parser",
    "crates/corint-decision-compiler",
    "crates/corint-decision-runtime",
    "crates/corint-decision-engine",
    "crates/corint-decision-sdk",
    "crates/corint-decision-server",
    "crates/corint-decision-repository",
    "crates/corint-decision-ffi",
    "crates/corint-decision-llm",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"

[workspace.package]
edition = "2021"
license = "Elastic-2.0"

# Note: Root-level examples have been removed.
# Code examples are now located in individual crate examples/ directories:
# - crates/corint-decision-runtime/examples/
# - crates/corint-decision-sdk/examples/
# - etc.
