[package]
name = "corint-decision-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Local MCP server for CDL authoring and offline Core decision evaluation"

[[bin]]
name = "corint-mcp"
path = "src/main.rs"

[dependencies]
corint-decision-toolchain = { path = "../corint-decision-toolchain" }
corint-decision-compiler = { path = "../corint-decision-compiler" }
corint-decision-engine = { path = "../corint-decision-engine" }
rmcp = { version = "3.4", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "net"] }
tokio-util = "0.7"
axum = "0.8"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
sha2 = "0.10"
tempfile = "3.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rmcp = { version = "3.4", default-features = false, features = ["client"] }
tokio = { version = "1", features = ["process", "io-util", "time"] }
