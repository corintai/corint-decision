[package]
name = "corint-decision-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Offline CDL static validation and Core tooling for humans and agents"

[[bin]]
name = "corint"
path = "src/main.rs"

[dependencies]
corint-decision-toolchain = { path = "../corint-decision-toolchain" }
corint-decision-compiler = { path = "../corint-decision-compiler" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
corint-decision-llm = { path = "../corint-decision-llm", features = ["core-generation"] }
tokio = { version = "1.0", features = ["rt", "time"] }
serde_yaml = { workspace = true }
jsonschema = { version = "0.17", default-features = false }
tempfile = "3.8"
sha2 = "0.10"
reqwest = { version = "0.11", default-features = false, features = ["json"] }

[features]
# Explicit two-binary test target; run through tests/scripts/run_core_e2e_tests.sh.
process-e2e = []

[[test]]
name = "core_process_e2e"
path = "tests/core_process_e2e.rs"
required-features = ["process-e2e"]
