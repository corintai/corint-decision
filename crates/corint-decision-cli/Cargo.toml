[package]
name = "corint-decision-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Offline strict CDL Core validation for humans and agents"

[[bin]]
name = "corint"
path = "src/main.rs"

[dependencies]
corint-decision-toolchain = { path = "../corint-decision-toolchain" }
corint-decision-compiler = { path = "../corint-decision-compiler" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
corint-decision-llm = { path = "../corint-decision-llm", features = ["core-generation"] }
tokio = { version = "1.0", features = ["rt", "time"] }
serde_yaml = { workspace = true }
jsonschema = { version = "0.17", default-features = false }
tempfile = "3.8"
sha2 = "0.10"
