[package]
name = "corint-decision-toolchain"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Shared offline CDL Core testing and source-package tooling"

[dependencies]
corint-decision-compiler = { path = "../corint-decision-compiler" }
corint-decision-engine = { path = "../corint-decision-engine", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
jsonschema = { version = "0.17", default-features = false }
tokio = { version = "1.0", features = ["rt", "time", "macros"] }
tempfile = "3.8"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
