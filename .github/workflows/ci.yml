name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  cdl-core:
    name: CDL Core conformance (offline policy fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Core behavior, trace, fixture mappings and compatibility claim checks
        run: cargo test -p corint-decision-engine --test cdl_core_conformance --locked
      - name: Run offline CLI validation, behavior, packages, import resolution and target contract checks
        run: cargo test -p corint-decision-cli --locked
      - name: Run shared toolchain and phase-0 W04/W07/W08 contract checks
        run: cargo test -p corint-decision-toolchain --locked
      - name: Run strict generator contract checks with offline model responses
        run: cargo test -p corint-decision-llm --features core-generation --test core_generation --locked
      - name: Install Protocol Buffers compiler for server build
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Run isolated Core server authorization and activation checks
        run: cargo test -p corint-decision-server --test core_activation --locked
      - name: Run Core process e2e (fixed model, real CLI and loopback HTTP)
        timeout-minutes: 15
        run: bash tests/scripts/run_core_e2e_tests.sh

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Check all document scopes, local links and executable example bindings
        run: python3 tests/scripts/check_docs.py

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Install Protocol Buffers compiler for server build
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: |
          CORINT_E2E_SERVER=$(bash tests/scripts/run_core_e2e_tests.sh --build-only)
          export CORINT_E2E_SERVER
          cargo test --all-features --workspace --locked

      - name: Run doc tests
        run: cargo test --doc --all-features --workspace

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Install Protocol Buffers compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Protocol Buffers compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Build all crates
        run: cargo build --release --all-features --workspace --locked

      - name: Build examples
        run: cargo build --release --examples --locked

      - name: Check binary size (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          ls -lh target/release/corint-decision-server
          du -sh target/release/corint-decision-server

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Install Protocol Buffers compiler for server build
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Generate coverage
        run: |
          CORINT_E2E_SERVER=$(bash tests/scripts/run_core_e2e_tests.sh --build-only)
          export CORINT_E2E_SERVER
          cargo tarpaulin --all-features --workspace --timeout 300 --out xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit
